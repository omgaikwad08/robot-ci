name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    - cron: "0 9 * * *"        # every day 09:00 UTC (1-2 AM Pacific)
  workflow_dispatch:           # adds a "Run workflow" button in the Actions tab

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m "not endurance"

  endurance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m endurance

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          mkdir -p dist
          echo "{\"commit\": \"${GITHUB_SHA}\", \"branch\": \"${GITHUB_REF_NAME}\"}" > build_info.json
          tar czf "dist/robot-${GITHUB_SHA::7}.tar.gz" gripper.py build_info.json
      - uses: actions/upload-artifact@v4
        with:
          name: robot-${{ github.sha }}
          path: dist/
